name: Deploy admin tool to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "admin-tool/**"
      - ".github/workflows/admin-pages.yml"
      - "docs/web-surface-strategy.md"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build static admin artifact
        env:
          SUPABASE_URL: ${{ vars.ADMIN_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.ADMIN_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_PUBLISHABLE_KEY"

          mkdir -p dist/admin
          cp -R admin-tool/. dist/admin/

          cat > dist/admin/config.local.js <<'CONFIG'
          window.ADMIN_TOOL_CONFIG = {
            supabaseUrl: "__SUPABASE_URL__",
            supabasePublishableKey: "__SUPABASE_PUBLISHABLE_KEY__"
          };
          CONFIG

          node - <<'NODE'
          const fs = require("fs");

          const configPath = "dist/admin/config.local.js";
          const config = fs.readFileSync(configPath, "utf8")
            .replace("__SUPABASE_URL__", process.env.SUPABASE_URL)
            .replace("__SUPABASE_PUBLISHABLE_KEY__", process.env.SUPABASE_PUBLISHABLE_KEY);

          fs.writeFileSync(configPath, config);
          NODE

          node - <<'NODE'
          const fs = require("fs");

          const indexPath = "dist/admin/index.html";
          const version = process.env.GITHUB_SHA || String(Date.now());
          const index = fs.readFileSync(indexPath, "utf8")
            .replaceAll(/config\.local\.js\?v=[^"]+/g, `config.local.js?v=${version}`)
            .replaceAll(/app\.js\?v=[^"]+/g, `app.js?v=${version}`)
            .replaceAll(/styles\.css\?v=[^"]+/g, `styles.css?v=${version}`);

          fs.writeFileSync(indexPath, index);
          NODE

          printf "User-agent: *\nDisallow: /\n" > dist/admin/robots.txt
          touch dist/admin/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/admin

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
