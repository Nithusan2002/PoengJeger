<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Poengjeger - designretninger</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      --ink: #172026;
      --muted: #65727a;
      --line: #dce5e8;
      --page: #f5f7f8;
      --panel: #ffffff;
      --teal: #14746f;
      --blue: #1f6ea8;
      --amber: #a55f1d;
      --red: #b84a42;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--page);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }
    button { font: inherit; }

    .page { min-height: 100vh; padding: 28px; }
    .top {
      max-width: 1480px;
      margin: 0 auto 22px;
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 24px;
    }
    h1 { margin: 0; font-size: clamp(30px, 4vw, 54px); line-height: .96; letter-spacing: 0; }
    .intro { max-width: 690px; margin: 10px 0 0; color: var(--muted); font-size: 15px; line-height: 1.45; }
    .switcher {
      display: flex;
      gap: 8px;
      padding: 5px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 12px 30px rgba(24, 32, 38, .08);
    }
    .switcher button {
      min-height: 36px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: #4c5961;
      padding: 0 12px;
      cursor: pointer;
      white-space: nowrap;
    }
    .switcher button.active { background: #172026; color: #fff; }

    .direction {
      max-width: 1480px;
      margin: 0 auto 28px;
      border: 1px solid var(--line);
      background: var(--panel);
      overflow: hidden;
    }
    .direction-head {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 18px;
      padding: 18px 20px;
      align-items: center;
      border-bottom: 1px solid var(--line);
    }
    .kicker {
      margin: 0 0 5px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 850;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    h2 { margin: 0; font-size: 22px; letter-spacing: 0; }
    .copy { max-width: 820px; margin: 7px 0 0; color: #516069; font-size: 14px; line-height: 1.45; }
    .tag {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 8px 12px;
      color: #30414a;
      background: #f9fbfb;
      font-size: 13px;
      white-space: nowrap;
    }
    .screens {
      display: grid;
      grid-template-columns: repeat(2, minmax(320px, 1fr));
      gap: 1px;
      background: var(--line);
    }
    .screen-wrap { min-width: 0; padding: 20px; background: #eef2f3; }
    .screen-label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 0 0 10px;
      color: #53616a;
      font-size: 12px;
      font-weight: 850;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .phone {
      width: min(100%, 430px);
      min-height: 758px;
      margin: 0 auto;
      border: 10px solid #111820;
      border-radius: 34px;
      overflow: hidden;
      background: #fff;
      box-shadow: 0 24px 52px rgba(17, 24, 32, .18);
    }
    .app { min-height: 738px; padding: 18px; }
    .status, .app-head, .split { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .status { height: 24px; font-size: 12px; font-weight: 850; }
    .icons { display: flex; gap: 8px; }
    .app-head { margin: 12px 0 16px; }
    .brand { min-width: 0; }
    .brand strong { display: block; font-size: 20px; line-height: 1.05; }
    .brand span { display: block; margin-top: 4px; opacity: .68; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .icon-btn {
      width: 36px;
      height: 36px;
      display: inline-grid;
      place-items: center;
      border: 1px solid currentColor;
      border-radius: 8px;
      background: transparent;
      color: inherit;
      opacity: .8;
    }
    .stack { display: grid; gap: 10px; }
    .two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .three { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    .label { display: block; color: inherit; opacity: .68; font-size: 11px; font-weight: 850; text-transform: uppercase; }
    .value { display: block; margin-top: 4px; font-size: 20px; line-height: 1; font-weight: 900; }
    .small { color: inherit; opacity: .72; font-size: 12px; line-height: 1.25; }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 28px;
      border-radius: 999px;
      padding: 0 10px;
      font-size: 12px;
      font-weight: 850;
      white-space: nowrap;
    }
    .list { display: grid; gap: 7px; }
    .row { display: grid; grid-template-columns: auto 1fr auto; gap: 9px; align-items: center; min-height: 52px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: currentColor; }
    .row-main, .split strong, .split span { min-width: 0; }
    .row-main strong, .row-main span, .split strong, .split span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row-main strong { font-size: 13px; }
    .row-main span { margin-top: 2px; opacity: .62; font-size: 11px; }
    .score { text-align: right; font-size: 12px; font-weight: 900; white-space: nowrap; }
    .bars { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; align-items: end; height: 88px; padding-top: 10px; }
    .bar { min-height: 10px; border-radius: 4px 4px 0 0; background: currentColor; opacity: .86; }
    .tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid currentColor;
      color: inherit;
      opacity: .85;
    }
    .tab { display: grid; place-items: center; min-height: 34px; border-radius: 8px; }
    .tab.active { background: currentColor; }
    .tab.active svg { color: #fff; }

    .control { background: #f8fbfb; color: #172026; }
    .control .app {
      background:
        linear-gradient(#dbe7ea 1px, transparent 1px),
        linear-gradient(90deg, #dbe7ea 1px, transparent 1px),
        #f8fbfb;
      background-size: 28px 28px;
    }
    .control .panel, .control .mini, .control .campaign {
      border: 1px solid #d5e0e3;
      border-radius: 8px;
      background: rgba(255, 255, 255, .94);
      padding: 10px;
    }
    .control .panel { padding: 12px; }
    .control .hero {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 10px;
      align-items: center;
      padding: 12px;
      border: 1px solid #cfdde1;
      border-radius: 8px;
      background: #fff;
    }
    .control .hero strong { font-size: 26px; }
    .control .accent { color: var(--blue); }
    .control .warm { color: var(--amber); }
    .control .pill { background: #e7f0f2; color: #23434f; }
    .control .filters { display: flex; gap: 6px; overflow: hidden; margin-bottom: 10px; }

    .cards { background: #fcfaf5; color: #24201a; }
    .cards .app { background: #fcfaf5; }
    .cards .ticket, .cards .mini, .cards .campaign {
      border: 1px solid #dac7aa;
      border-radius: 8px;
      background: #fffdf8;
      padding: 10px;
    }
    .cards .ticket { position: relative; padding: 12px; overflow: hidden; }
    .cards .ticket:before, .cards .ticket:after {
      content: "";
      position: absolute;
      top: 50%;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #fcfaf5;
      border: 1px solid #dac7aa;
      transform: translateY(-50%);
    }
    .cards .ticket:before { left: -10px; }
    .cards .ticket:after { right: -10px; }
    .cards .stamp {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      border: 1px solid #b97838;
      border-radius: 4px;
      padding: 0 8px;
      color: #9b5518;
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
      transform: rotate(-2deg);
    }
    .cards .pill { background: #efe3d0; color: #684019; }
    .cards .progress { height: 9px; border: 1px solid #c8a776; border-radius: 999px; overflow: hidden; background: #fbf2e4; }
    .cards .progress span { display: block; width: var(--w); height: 100%; background: #1d7568; }

    .night { background: #0c1116; color: #eef5f7; }
    .night .app {
      background:
        radial-gradient(circle at 20% 14%, rgba(49,142,150,.26), transparent 32%),
        linear-gradient(180deg, #111a20 0%, #0c1116 62%);
    }
    .night .panel, .night .campaign, .night .head {
      border: 1px solid rgba(159, 211, 213, .16);
      border-radius: 8px;
      background: rgba(255, 255, 255, .055);
      padding: 12px;
    }
    .night .ticker {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1px;
      border: 1px solid rgba(159, 211, 213, .14);
      border-radius: 8px;
      background: rgba(159, 211, 213, .14);
      overflow: hidden;
    }
    .night .ticker div { min-width: 0; padding: 10px; background: rgba(255, 255, 255, .045); }
    .night .chart {
      height: 116px;
      border: 1px solid rgba(159, 211, 213, .12);
      border-radius: 8px;
      background:
        linear-gradient(rgba(159,211,213,.11) 1px, transparent 1px),
        linear-gradient(90deg, rgba(159,211,213,.1) 1px, transparent 1px);
      background-size: 100% 25%, 25% 100%;
      position: relative;
      overflow: hidden;
    }
    .night .chart svg { position: absolute; inset: 0; width: 100%; height: 100%; }
    .night .pill { background: rgba(80,176,157,.16); color: #9ee6d5; }
    .night .positive { color: #77d8b9; }
    .night .urgent { color: #f1998f; }
    .night .tabs { border-color: rgba(238, 245, 247, .14); }

    @media (max-width: 900px) {
      .page { padding: 16px; }
      .top, .direction-head, .screens { grid-template-columns: 1fr; }
      .top { align-items: start; }
      .switcher { width: 100%; overflow-x: auto; }
      .tag { justify-self: start; }
      .screen-wrap { padding: 14px; }
      .phone { min-height: 700px; }
      .app { min-height: 680px; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useEffect, useState } = React;

    const campaigns = [
      ["EuroBonus", "20% ekstra poeng hos utvalgte hoteller", "Hoy verdi"],
      ["Trumf", "Dobbel bonus hos nettbutikker i helgen", "Kort frist"],
      ["Norwegian Reward", "CashPoints paa sommerbilletter", "Enkel bruk"],
      ["Strawberry", "Bonusnetter teller dobbelt i august", "Familieferie"],
      ["Flying Blue", "Promo Rewards til Europa", "Krever fleks"],
    ];

    function Icon({ name, size = 17 }) {
      useEffect(() => { if (window.lucide) window.lucide.createIcons(); });
      return <i data-lucide={name} style={{ width: size, height: size }} aria-hidden="true"></i>;
    }

    function Phone({ className, children }) {
      return (
        <div className={`phone ${className}`}>
          <div className="app">
            <div className="status">
              <span>09:41</span>
              <span className="icons"><Icon name="signal" size={14} /><Icon name="wifi" size={14} /><Icon name="battery" size={15} /></span>
            </div>
            {children}
          </div>
        </div>
      );
    }

    function AppHead({ subtitle }) {
      return (
        <div className="app-head">
          <div className="brand">
            <strong>Poengjeger</strong>
            <span>{subtitle}</span>
          </div>
          <button className="icon-btn" title="Varsler"><Icon name="bell" /></button>
        </div>
      );
    }

    function Tabs() {
      return (
        <div className="tabs">
          <div className="tab active"><Icon name="layout-dashboard" /></div>
          <div className="tab"><Icon name="list-filter" /></div>
          <div className="tab"><Icon name="bookmark" /></div>
          <div className="tab"><Icon name="settings" /></div>
        </div>
      );
    }

    function CampaignRows({ mode }) {
      return (
        <div className="list">
          {campaigns.map(([program, title, score], index) => (
            <div className="row campaign">
              {mode === "icons" ? <Icon name={index === 1 ? "shopping-bag" : index === 2 ? "plane" : index === 3 ? "bed" : "badge-percent"} /> : <span className="dot" style={{ color: index === 1 ? "#a55f1d" : index === 4 ? "#b84a42" : "currentColor" }} />}
              <span className="row-main"><strong>{program}</strong><span>{title}</span></span>
              <span className="score">{score}</span>
            </div>
          ))}
        </div>
      );
    }

    function ControlHome() {
      return (
        <Phone className="control">
          <AppHead subtitle="Kampanjekontroll for aktive poengjegere" />
          <div className="stack">
            <div className="hero">
              <div><span className="label">Relevante naa</span><strong>18</strong></div>
              <Icon name="radar" size={26} />
              <div style={{ textAlign: "right" }}><span className="label">Hoy verdi</span><strong>6</strong></div>
            </div>
            <div className="two">
              <div className="panel accent"><span className="label">Sjekket i dag</span><span className="value">12</span><span className="small">fra offisielle kilder</span></div>
              <div className="panel warm"><span className="label">Frist snart</span><span className="value">4</span><span className="small">under 72 timer</span></div>
            </div>
            <div className="panel">
              <div className="split"><strong>Kampanjepuls</strong><span className="small">7 dager</span></div>
              <div className="bars accent">{[35, 62, 44, 81, 58, 92, 70].map(h => <span className="bar" style={{ height: h + "%" }} />)}</div>
            </div>
            <div className="three">
              {["EuroBonus 7", "Trumf 5", "Reward 3"].map(item => <div className="mini"><span className="small">{item}</span></div>)}
            </div>
            <div className="panel"><div className="split"><strong>Beste mulighet</strong><span className="pill">Hoy verdi</span></div><p className="small">Dobbel Trumf hos nettbutikker med tydelige vilkaar og kort frist.</p></div>
          </div>
          <Tabs />
        </Phone>
      );
    }

    function ControlList() {
      return (
        <Phone className="control">
          <AppHead subtitle="Kompakt kampanjeliste med filter" />
          <div className="filters">{["Alle", "EuroBonus", "Trumf", "Hotell", "Frist"].map(f => <span className="pill">{f}</span>)}</div>
          <div className="stack">
            <div className="two"><div className="mini"><span className="label">Aktive</span><span className="value">18</span></div><div className="mini warm"><span className="label">Usikker kilde</span><span className="value">0</span></div></div>
            <CampaignRows />
            <div className="panel"><div className="split"><strong>Forklaring</strong><span className="small">Redaksjonell</span></div><p className="small">Rangering viser verdi, tidsfrist, krav og kildekvalitet.</p></div>
          </div>
          <Tabs />
        </Phone>
      );
    }

    function CardsHome() {
      return (
        <Phone className="cards">
          <AppHead subtitle="Reisekort, maal og lagrede funn" />
          <div className="stack">
            <div className="ticket">
              <div className="split"><span className="stamp">Ukevalg</span><span className="small">Passer din profil</span></div>
              <div style={{ marginTop: 18 }}><span className="label">Kampanjeverdi</span><span className="value">Meget hoy</span><div className="progress" style={{ "--w": "78%", marginTop: 10 }}><span></span></div></div>
            </div>
            <div className="two">
              <div className="mini"><span className="label">Lagret</span><span className="value">9</span></div>
              <div className="mini"><span className="label">Varsler</span><span className="value">3</span></div>
            </div>
            <div className="ticket">
              {[
                ["EuroBonus", "20% ekstra", "Sterk"],
                ["Strawberry", "Doble netter", "Relevant"],
                ["Trumf", "Helgekampanje", "Haster"],
              ].map(([a, b, c]) => <div className="row" style={{ borderBottom: "1px dashed #d3bd9b" }}><Icon name="ticket" /><span className="row-main"><strong>{a}</strong><span>{b}</span></span><span className="pill">{c}</span></div>)}
            </div>
            <div className="mini"><div className="split"><strong>Dagens prioritet</strong><Icon name="arrow-up-right" /></div><p className="small">Les vilkaarene foer du klikker videre til partner.</p></div>
          </div>
          <Tabs />
        </Phone>
      );
    }

    function CardsList() {
      return (
        <Phone className="cards">
          <AppHead subtitle="Kortbasert kampanjeoversikt" />
          <div className="stack">
            <div className="ticket"><div className="split"><strong>Favoritter</strong><span className="stamp">9 lagret</span></div><div className="three" style={{ marginTop: 12 }}><div><span className="label">Nye</span><span className="value">5</span></div><div><span className="label">Frist</span><span className="value">4</span></div><div><span className="label">Klar</span><span className="value">12</span></div></div></div>
            <CampaignRows mode="icons" />
            <div className="ticket"><div className="split"><strong>Kildekontroll</strong><span className="pill">Sjekket</span></div><p className="small">Hver kampanje viser kilde, kontrolltidspunkt og tydelige krav i detaljvisning.</p></div>
          </div>
          <Tabs />
        </Phone>
      );
    }

    function NightHome() {
      return (
        <Phone className="night">
          <AppHead subtitle="Signalflate for raske daglige sjekker" />
          <div className="stack">
            <div className="head"><div className="split"><span className="label">Nye signaler</span><span className="pill"><Icon name="trending-up" size={14} />Live</span></div><span className="value" style={{ fontSize: 34 }}>18</span><span className="small positive">6 kampanjer er vurdert som hoy verdi</span></div>
            <div className="ticker"><div><span className="label">Hoy</span><span className="value">6</span></div><div><span className="label">Frist</span><span className="value urgent">4</span></div><div><span className="label">Lagret</span><span className="value">9</span></div></div>
            <div className="panel"><div className="split"><strong>Kampanjeaktivitet</strong><span className="small">30 dager</span></div><div className="chart"><svg viewBox="0 0 320 116" preserveAspectRatio="none"><path d="M0 82 C34 76 42 48 78 54 C111 59 115 27 153 35 C192 43 195 70 232 58 C268 47 280 24 320 18" fill="none" stroke="#76d6c0" strokeWidth="4"/><path d="M0 82 C34 76 42 48 78 54 C111 59 115 27 153 35 C192 43 195 70 232 58 C268 47 280 24 320 18 L320 116 L0 116 Z" fill="rgba(118,214,192,.12)"/></svg></div></div>
            <div className="two"><div className="panel"><span className="label">Kildekvalitet</span><span className="value positive">God</span></div><div className="panel"><span className="label">Neste frist</span><span className="value">2 d</span></div></div>
          </div>
          <Tabs />
        </Phone>
      );
    }

    function NightList() {
      return (
        <Phone className="night">
          <AppHead subtitle="Prioritert liste for power users" />
          <div className="stack">
            <div className="ticker"><div><span className="label">Aktive</span><span className="value">18</span></div><div><span className="label">Nye</span><span className="value positive">5</span></div><div><span className="label">Utloper</span><span className="value urgent">4</span></div></div>
            <CampaignRows />
            <div className="panel"><div className="split"><strong>Varsler</strong><span className="pill">3 aktive</span></div><p className="small">Kun spesielt relevante kampanjer varsles for aa holde stoyen lav.</p></div>
          </div>
          <Tabs />
        </Phone>
      );
    }

    const directions = [
      {
        id: "control",
        title: "1. Datadrevet kontrollrom",
        tag: "Analytisk, tett, operativ",
        copy: "Rutenett, minipaneler og tydelige terskler. Passer brukere som sjekker ofte og vil finne hoyverdi-kampanjer raskt.",
        screens: [<ControlHome />, <ControlList />],
      },
      {
        id: "cards",
        title: "2. Reisebrev og kampanjekort",
        tag: "Taktil, rolig, maalstyrt",
        copy: "Kort og boardingpass-metafor kobler kampanjer til konkrete reisevalg uten aa late som appen kjenner privat saldo.",
        screens: [<CardsHome />, <CardsList />],
      },
      {
        id: "night",
        title: "3. Night signal",
        tag: "Mork, premium, grafdrevet",
        copy: "Mork modus med signaler, trendlinjer og kompakt prioritering for aktive bonusentusiaster som sjekker ofte.",
        screens: [<NightHome />, <NightList />],
      },
    ];

    function Direction({ direction }) {
      return (
        <section className="direction" id={direction.id}>
          <div className="direction-head">
            <div>
              <p className="kicker">Designretning</p>
              <h2>{direction.title}</h2>
              <p className="copy">{direction.copy}</p>
            </div>
            <span className="tag">{direction.tag}</span>
          </div>
          <div className="screens">
            <div className="screen-wrap"><div className="screen-label"><span>Hovedskjerm</span><Icon name="smartphone" size={14} /></div>{direction.screens[0]}</div>
            <div className="screen-wrap"><div className="screen-label"><span>Kampanjeliste</span><Icon name="list-filter" size={14} /></div>{direction.screens[1]}</div>
          </div>
        </section>
      );
    }

    function App() {
      const [active, setActive] = useState("all");
      const shown = active === "all" ? directions : directions.filter(d => d.id === active);
      return (
        <main className="page">
          <header className="top">
            <div>
              <h1>Tre visuelle retninger</h1>
              <p className="intro">HTML/React-mockups for Poengjeger. Retningene viser hovedskjerm og kampanjeliste med kompakt informasjonstetthet for unge og voksne reiseglade som jakter bonuskampanjer.</p>
            </div>
            <nav className="switcher" aria-label="Velg retning">
              <button className={active === "all" ? "active" : ""} onClick={() => setActive("all")}>Alle</button>
              {directions.map(d => <button className={active === d.id ? "active" : ""} onClick={() => setActive(d.id)}>{d.title.split(". ")[1]}</button>)}
            </nav>
          </header>
          {shown.map(direction => <Direction key={direction.id} direction={direction} />)}
        </main>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
