<!doctype html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PoengJeger designretninger</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root { --ink:#182026; --muted:#66747d; --line:#dfe6e9; --page:#f4f7f7; --panel:#fff; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--page); color:var(--ink); font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing:0; }
    button { font:inherit; }
    .shell { min-height:100vh; padding:28px; }
    .topbar { display:flex; align-items:end; justify-content:space-between; gap:24px; max-width:1480px; margin:0 auto 22px; }
    .topbar h1 { margin:0; font-size:clamp(28px,4vw,52px); line-height:.96; letter-spacing:0; }
    .topbar p { max-width:660px; margin:10px 0 0; color:var(--muted); font-size:15px; line-height:1.45; }
    .selector { display:flex; gap:8px; padding:5px; border:1px solid var(--line); border-radius:8px; background:#fff; box-shadow:0 10px 28px rgba(24,32,38,.08); }
    .selector button { min-height:36px; border:0; border-radius:6px; background:transparent; color:#4b5961; padding:0 12px; cursor:pointer; white-space:nowrap; }
    .selector button.active { background:#172026; color:#fff; }
    .direction { max-width:1480px; margin:0 auto 28px; border:1px solid var(--line); background:var(--panel); overflow:hidden; }
    .direction-head { display:grid; grid-template-columns:1fr auto; gap:18px; align-items:center; padding:18px 20px; border-bottom:1px solid var(--line); }
    .kicker { margin:0 0 5px; color:var(--muted); font-size:12px; text-transform:uppercase; font-weight:850; letter-spacing:.12em; }
    .direction h2 { margin:0; font-size:22px; letter-spacing:0; }
    .direction-copy { margin:7px 0 0; max-width:860px; color:#516069; font-size:14px; line-height:1.45; }
    .direction-tag { border:1px solid var(--line); border-radius:999px; padding:8px 12px; color:#30414a; font-size:13px; white-space:nowrap; background:#f9fbfb; }
    .mockup-pair { display:grid; grid-template-columns:repeat(2,minmax(320px,1fr)); gap:1px; background:var(--line); }
    .screen-wrap { min-width:0; background:#eef2f3; padding:20px; }
    .screen-label { display:flex; align-items:center; justify-content:space-between; margin:0 0 10px; color:#53616a; font-size:12px; font-weight:850; text-transform:uppercase; letter-spacing:.1em; }
    .phone { width:min(100%,430px); min-height:760px; margin:0 auto; border:10px solid #111820; border-radius:34px; overflow:hidden; box-shadow:0 24px 52px rgba(17,24,32,.18); background:#fff; }
    .app { min-height:740px; padding:18px; }
    .status, .app-head, .split { display:flex; align-items:center; justify-content:space-between; gap:10px; }
    .status { height:24px; font-size:12px; font-weight:850; }
    .icons { display:flex; gap:8px; }
    .app-head { margin:12px 0 16px; }
    .brand { min-width:0; }
    .brand strong { display:block; font-size:20px; line-height:1.05; }
    .brand span { display:block; margin-top:4px; opacity:.68; font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .icon-btn { width:36px; height:36px; display:inline-grid; place-items:center; border:1px solid currentColor; border-radius:8px; background:transparent; color:inherit; opacity:.8; }
    .stack { display:grid; gap:10px; }
    .metrics { display:grid; grid-template-columns:1.35fr 1fr; gap:8px; }
    .two { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; }
    .three { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; }
    .label { color:inherit; opacity:.68; font-size:11px; font-weight:850; text-transform:uppercase; }
    .value { display:block; margin-top:4px; font-size:20px; line-height:1; font-weight:900; }
    .small { font-size:12px; line-height:1.25; color:inherit; opacity:.72; }
    .list { display:grid; gap:7px; }
    .row { display:grid; grid-template-columns:auto 1fr auto; gap:9px; align-items:center; min-height:48px; }
    .dot { width:10px; height:10px; border-radius:50%; background:currentColor; }
    .row-main { min-width:0; }
    .row-main strong, .row-main span, .split strong, .split span { display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .row-main strong { font-size:13px; }
    .row-main span { margin-top:2px; opacity:.62; font-size:11px; }
    .row-side { text-align:right; font-size:12px; font-weight:900; white-space:nowrap; }
    .pill { display:inline-flex; align-items:center; gap:6px; min-height:28px; border-radius:999px; padding:0 10px; font-size:12px; font-weight:850; white-space:nowrap; }
    .tabs { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-top:14px; padding-top:12px; border-top:1px solid currentColor; color:inherit; opacity:.85; }
    .tab { display:grid; place-items:center; min-height:34px; border-radius:8px; color:inherit; }
    .tab.active { background:currentColor; }
    .tab.active svg { color:#fff; }
    .bars { display:grid; grid-template-columns:repeat(7,1fr); gap:6px; align-items:end; height:92px; padding-top:10px; }
    .bar { min-height:10px; border-radius:4px 4px 0 0; background:currentColor; opacity:.86; }

    .tower { background:#f8fbfb; color:#172026; }
    .tower .app { background:linear-gradient(#dbe7ea 1px,transparent 1px),linear-gradient(90deg,#dbe7ea 1px,transparent 1px),#f8fbfb; background-size:28px 28px; }
    .tower .panel, .tower .mini, .tower .tx { border:1px solid #d5e0e3; border-radius:8px; background:rgba(255,255,255,.92); padding:10px; }
    .tower .panel { padding:12px; }
    .tower .accent { color:#0f6b8d; }
    .tower .warm { color:#a25a1a; }
    .tower .route { display:grid; grid-template-columns:1fr auto 1fr; gap:10px; align-items:center; padding:12px; border:1px solid #cfdde1; border-radius:8px; background:#fff; }
    .tower .route strong { font-size:26px; }
    .tower .filters { display:flex; gap:6px; overflow:hidden; margin-bottom:10px; }
    .tower .pill { background:#e7f0f2; color:#23434f; }

    .ledger { background:#fcfaf5; color:#24201a; }
    .ledger .app { background:#fcfaf5; }
    .ledger .ticket, .ledger .mini, .ledger .tx { border:1px solid #dac7aa; border-radius:8px; background:#fffdf8; padding:10px; }
    .ledger .ticket { position:relative; padding:12px; overflow:hidden; }
    .ledger .ticket:before, .ledger .ticket:after { content:""; position:absolute; top:50%; width:18px; height:18px; border-radius:50%; background:#fcfaf5; border:1px solid #dac7aa; transform:translateY(-50%); }
    .ledger .ticket:before { left:-10px; }
    .ledger .ticket:after { right:-10px; }
    .ledger .stamp { display:inline-flex; align-items:center; min-height:28px; border:1px solid #b97838; border-radius:4px; padding:0 8px; color:#9b5518; font-size:11px; font-weight:900; text-transform:uppercase; transform:rotate(-2deg); }
    .ledger .manifest { display:grid; grid-template-columns:1fr auto; gap:10px; align-items:center; padding:10px 0; border-bottom:1px dashed #d3bd9b; }
    .ledger .manifest:last-child { border-bottom:0; }
    .ledger .pill { background:#efe3d0; color:#684019; }
    .ledger .progress { height:9px; border:1px solid #c8a776; border-radius:999px; overflow:hidden; background:#fbf2e4; }
    .ledger .progress span { display:block; width:var(--w); height:100%; background:#1d7568; }

    .night { background:#0c1116; color:#eef5f7; }
    .night .app { background:radial-gradient(circle at 20% 14%,rgba(49,142,150,.26),transparent 32%),linear-gradient(180deg,#111a20 0%,#0c1116 62%); }
    .night .head, .night .panel, .night .tx { border:1px solid rgba(159,211,213,.16); border-radius:8px; background:rgba(255,255,255,.055); padding:12px; }
    .night .ticker { display:grid; grid-template-columns:repeat(3,1fr); gap:1px; background:rgba(159,211,213,.14); border:1px solid rgba(159,211,213,.14); border-radius:8px; overflow:hidden; }
    .night .ticker div { min-width:0; padding:10px; background:rgba(255,255,255,.045); }
    .night .chart { height:116px; border:1px solid rgba(159,211,213,.12); border-radius:8px; background:linear-gradient(rgba(159,211,213,.11) 1px,transparent 1px),linear-gradient(90deg,rgba(159,211,213,.1) 1px,transparent 1px); background-size:100% 25%,25% 100%; position:relative; overflow:hidden; }
    .night .chart svg { position:absolute; inset:0; width:100%; height:100%; }
    .night .pill { background:rgba(80,176,157,.16); color:#9ee6d5; }
    .positive { color:#77d8b9; }
    .negative { color:#f1998f; }
    .night .tabs { border-color:rgba(238,245,247,.14); }

    @media (max-width:900px) {
      .shell { padding:16px; }
      .topbar, .direction-head, .mockup-pair { grid-template-columns:1fr; }
      .topbar { align-items:start; }
      .selector { width:100%; overflow-x:auto; }
      .direction-tag { justify-self:start; }
      .screen-wrap { padding:14px; }
      .phone { min-height:700px; }
      .app { min-height:680px; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;
    const tx = [
      ["SAS EuroBonus", "Amex Premium - dagligvare", "+1 240 p"],
      ["Strawberry", "Hotellopphold Oslo", "+3 800 p"],
      ["Norwegian Reward", "Fly Oslo-Berlin", "+720 p"],
      ["Trumf", "Konvertering til EuroBonus", "-5 000 p"],
      ["SAS EuroBonus", "Utloeper 31. aug", "-1 200 p"],
    ];
    function Icon({ name, size = 17 }) {
      useEffect(() => { if (window.lucide) window.lucide.createIcons(); });
      return <i data-lucide={name} style={{ width:size, height:size }} aria-hidden="true"></i>;
    }
    function Phone({ className, children }) {
      return <div className={`phone ${className}`}><div className="app">
        <div className="status"><span>09:41</span><span className="icons"><Icon name="signal" size={14}/><Icon name="wifi" size={14}/><Icon name="battery" size={15}/></span></div>
        {children}
      </div></div>;
    }
    function AppHead({ subtitle }) {
      return <div className="app-head"><div className="brand"><strong>PoengJeger</strong><span>{subtitle}</span></div><button className="icon-btn" title="Varsler"><Icon name="bell"/></button></div>;
    }
    function Tabs() {
      return <div className="tabs"><div className="tab active"><Icon name="layout-dashboard"/></div><div className="tab"><Icon name="receipt-text"/></div><div className="tab"><Icon name="plane"/></div><div className="tab"><Icon name="settings"/></div></div>;
    }
    function TowerDashboard() {
      return <Phone className="tower"><AppHead subtitle="Sanntidsoversikt for alle programmer"/><div className="stack">
        <div className="route"><div><span className="label">Neste maal</span><strong>OSL</strong></div><Icon name="plane" size={24}/><div style={{textAlign:"right"}}><span className="label">Klar om</span><strong>9 d</strong></div></div>
        <div className="metrics"><div className="panel accent"><span className="label">Total verdi</span><span className="value">42 860 p</span><span className="small">+8,4% siste 30 dager</span></div><div className="panel warm"><span className="label">Risiko</span><span className="value">6 200</span><span className="small">utloeper snart</span></div></div>
        <div className="panel"><div className="split"><strong>Opptjening per uke</strong><span className="small">7 kilder</span></div><div className="bars accent">{[35,62,44,81,58,92,70].map(h => <span className="bar" style={{height:h+"%"}} />)}</div></div>
        <div className="three">{["EuroBonus 27,4k","Trumf 8,2k","Reward 7,1k"].map(item => <div className="mini"><span className="small">{item}</span></div>)}</div>
        <div className="panel"><div className="split"><strong>Beste trekk naa</strong><span className="pill">+3 500 p</span></div><p className="small">Flytt Trumf-saldo foer kampanjen stenger fredag.</p></div>
      </div><Tabs/></Phone>;
    }
    function TowerTransactions() {
      return <Phone className="tower"><AppHead subtitle="Transaksjonsliste med filtrering"/><div className="filters">{["Alle","Kort","Fly","Hotell","Utlop"].map(f => <span className="pill">{f}</span>)}</div><div className="stack">
        <div className="two"><div className="mini"><span className="label">Denne mnd</span><span className="value">8 140</span></div><div className="mini warm"><span className="label">Mangler</span><span className="value">2 krav</span></div></div>
        <div className="list">{tx.map(([program,desc,points],i) => <div className="row tx"><span className="dot" style={{color:i===4 ? "#b84a42" : "#0f6b8d"}}></span><span className="row-main"><strong>{program}</strong><span>{desc}</span></span><span className="row-side">{points}</span></div>)}</div>
        <div className="panel"><div className="split"><strong>Avstemming</strong><span className="small">82%</span></div><div className="bars warm" style={{height:58}}>{[50,35,70,88,45,62,80].map(h => <span className="bar" style={{height:h+"%"}} />)}</div></div>
      </div><Tabs/></Phone>;
    }
    function LedgerDashboard() {
      return <Phone className="ledger"><AppHead subtitle="Reisebok med maal, status og kuponger"/><div className="stack">
        <div className="ticket"><div className="split"><span className="stamp">Boarding snart</span><span className="small">CPH i oktober</span></div><div style={{marginTop:18}}><span className="label">Manglende poeng</span><span className="value">12 450</span><div className="progress" style={{"--w":"73%",marginTop:10}}><span></span></div></div></div>
        <div className="two"><div className="mini"><span className="label">Saldo</span><span className="value">42,8k</span></div><div className="mini"><span className="label">Kuponger</span><span className="value">3</span></div></div>
        <div className="ticket">{[["EuroBonus","27 400 p","73%"],["Strawberry","9 netter","41%"],["Norwegian","7 120 p","58%"]].map(([a,b,c]) => <div className="manifest"><div><strong>{a}</strong><div className="small">{b}</div></div><span className="pill">{c}</span></div>)}</div>
        <div className="mini"><div className="split"><strong>Dagens prioritet</strong><Icon name="arrow-up-right"/></div><p className="small">Bruk SAS Mastercard paa dagligvare frem til sondag.</p></div>
      </div><Tabs/></Phone>;
    }
    function LedgerTransactions() {
      return <Phone className="ledger"><AppHead subtitle="Manifest over poengbevegelser"/><div className="stack">
        <div className="ticket"><div className="split"><strong>August-manifest</strong><span className="stamp">Kontrollert</span></div><div className="three" style={{marginTop:12}}><div><span className="label">Inn</span><span className="value">9,6k</span></div><div><span className="label">Ut</span><span className="value">5,0k</span></div><div><span className="label">Netto</span><span className="value">4,6k</span></div></div></div>
        <div className="list">{tx.map(([program,desc,points],i) => <div className="row tx"><Icon name={i===1 ? "bed" : i===2 ? "plane" : i===3 ? "repeat" : "credit-card"}/><span className="row-main"><strong>{program}</strong><span>{desc}</span></span><span className="row-side">{points}</span></div>)}</div>
        <div className="ticket"><div className="split"><strong>Bilag mangler</strong><span className="pill">2 saker</span></div><p className="small">Koble Nordea-kortet for automatisk matching.</p></div>
      </div><Tabs/></Phone>;
    }
    function NightDashboard() {
      return <Phone className="night"><AppHead subtitle="Mork modus med poeng som markedsdata"/><div className="stack">
        <div className="head"><div className="split"><span className="label">Portefoljeverdi</span><span className="pill"><Icon name="trending-up" size={14}/>Live</span></div><span className="value" style={{fontSize:34}}>42 860 p</span><span className="small positive">+3 240 poeng siden sist innlogging</span></div>
        <div className="ticker"><div><span className="label">SAS</span><span className="value">27.4</span></div><div><span className="label">TRF</span><span className="value">8.2</span></div><div><span className="label">NO</span><span className="value">7.1</span></div></div>
        <div className="panel"><div className="split"><strong>Momentum</strong><span className="small">30 dager</span></div><div className="chart"><svg viewBox="0 0 320 116" preserveAspectRatio="none"><path d="M0 82 C34 76 42 48 78 54 C111 59 115 27 153 35 C192 43 195 70 232 58 C268 47 280 24 320 18" fill="none" stroke="#76d6c0" strokeWidth="4"/><path d="M0 82 C34 76 42 48 78 54 C111 59 115 27 153 35 C192 43 195 70 232 58 C268 47 280 24 320 18 L320 116 L0 116 Z" fill="rgba(118,214,192,.12)"/></svg></div></div>
        <div className="two"><div className="panel"><span className="label">Burn-rate</span><span className="value negative">-1.2k</span></div><div className="panel"><span className="label">Neste bonus</span><span className="value">9 d</span></div></div>
      </div><Tabs/></Phone>;
    }
    function NightTransactions() {
      return <Phone className="night"><AppHead subtitle="Hendelsesstrom for aktive jegere"/><div className="stack">
        <div className="ticker"><div><span className="label">Inntj.</span><span className="value positive">+9.6k</span></div><div><span className="label">Utlop</span><span className="value negative">1.2k</span></div><div><span className="label">ROI</span><span className="value">4.1x</span></div></div>
        <div className="list">{tx.map(([program,desc,points],i) => <div className="row tx"><span className="dot" style={{color:i===4 ? "#f1998f" : "#76d6c0"}}></span><span className="row-main"><strong>{program}</strong><span>{desc}</span></span><span className={`row-side ${points.startsWith("-") ? "negative" : "positive"}`}>{points}</span></div>)}</div>
        <div className="panel"><div className="split"><strong>Varsler</strong><span className="pill">3 aktive</span></div><p className="small">To transaksjoner gir bedre verdi om de flyttes til Strawberry.</p></div>
      </div><Tabs/></Phone>;
    }
    const directions = [
      { id:"tower", title:"1. Datadrevet Kontrolltaarn", tag:"Analytisk, tett, operativ", copy:"Rutenett, minipaneler og tydelige terskler. Passer brukere som sjekker ofte og vil ta raske valg om kortbruk, konvertering og utlop.", screens:[<TowerDashboard/>, <TowerTransactions/>] },
      { id:"ledger", title:"2. Reisebok og Boardingpass", tag:"Taktil, oversiktlig, maalstyrt", copy:"Billett- og manifestmetafor kobler poeng direkte til reiser. Mer menneskelig og mindre bankaktig, men fortsatt kompakt.", screens:[<LedgerDashboard/>, <LedgerTransactions/>] },
      { id:"night", title:"3. Night Market Portfolio", tag:"Mork, grafdrevet, premium", copy:"Poeng fremstilles som portefolje med live-folging, momentum og hendelsesstrom. God for power users og daglig sjekk paa mobil.", screens:[<NightDashboard/>, <NightTransactions/>] },
    ];
    function Direction({ direction }) {
      return <section className="direction" id={direction.id}><div className="direction-head"><div><p className="kicker">Designretning</p><h2>{direction.title}</h2><p className="direction-copy">{direction.copy}</p></div><span className="direction-tag">{direction.tag}</span></div><div className="mockup-pair"><div className="screen-wrap"><div className="screen-label"><span>Hovedskjerm</span><Icon name="smartphone" size={14}/></div>{direction.screens[0]}</div><div className="screen-wrap"><div className="screen-label"><span>Transaksjonsliste</span><Icon name="list-filter" size={14}/></div>{direction.screens[1]}</div></div></section>;
    }
    function App() {
      const [active, setActive] = useState("all");
      const shown = active === "all" ? directions : directions.filter(d => d.id === active);
      return <main className="shell"><header className="topbar"><div><h1>Tre visuelle retninger</h1><p>HTML/React-mockups for PoengJeger med kompakt informasjonstetthet for reiseglade poengjegere. Velg retning, saa kan den bygges ut til flere skjermer.</p></div><nav className="selector" aria-label="Velg retning"><button className={active==="all" ? "active" : ""} onClick={() => setActive("all")}>Alle</button>{directions.map(d => <button className={active===d.id ? "active" : ""} onClick={() => setActive(d.id)}>{d.title.split(". ")[1]}</button>)}</nav></header>{shown.map(direction => <Direction key={direction.id} direction={direction}/>)}</main>;
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
